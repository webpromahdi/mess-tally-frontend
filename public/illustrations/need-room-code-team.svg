<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="teamBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECC8E6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ECC8E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plusBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CE66"/>
      <stop offset="100%" stop-color="#EAAA00"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <ellipse cx="86" cy="65" rx="65" ry="45" fill="url(#teamBackdrop)"/>

  <!-- Left Avatar (Subtle) -->
  <g opacity="0.75">
    <circle cx="56" cy="50" r="14" fill="#8C3A7E"/>
    <path d="M38 88 C38 72 46 68 56 68 C66 68 74 72 74 88 Z" fill="#6B2560"/>
  </g>

  <!-- Right Avatar (Subtle) -->
  <g opacity="0.75">
    <circle cx="114" cy="50" r="14" fill="#8C3A7E"/>
    <path d="M96 88 C96 72 104 68 114 68 C124 68 132 72 132 88 Z" fill="#6B2560"/>
  </g>

  <!-- Center Avatar (Prominent Front) -->
  <g>
    <circle cx="85" cy="42" r="18" fill="#501A4A"/>
    <path d="M62 90 C62 70 72 65 85 65 C98 65 108 70 108 90 Z" fill="#3A0F34"/>
  </g>

  <!-- Floating Golden '+' Invite Badge -->
  <g transform="translate(104, 58)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="18" cy="18" r="15" fill="url(#plusBadgeGrad)"/>
    <!-- '+' Symbol -->
    <path d="M18 10 L18 26 M10 18 L26 18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
