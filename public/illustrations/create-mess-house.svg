<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="houseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECC8E6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ECC8E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B2560"/>
      <stop offset="100%" stop-color="#3A0F34"/>
    </linearGradient>
    <linearGradient id="wallLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A0CB"/>
      <stop offset="100%" stop-color="#B46EA8"/>
    </linearGradient>
    <linearGradient id="wallRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC8E6"/>
      <stop offset="100%" stop-color="#D4A0CB"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="80" cy="70" rx="60" ry="40" fill="url(#houseGlow)"/>

  <!-- Base Ground Shadow -->
  <ellipse cx="80" cy="100" rx="54" ry="10" fill="#3A0F34" fill-opacity="0.08"/>

  <!-- Background Tree / Bush -->
  <ellipse cx="120" cy="78" rx="14" ry="18" fill="#8C3A7E" fill-opacity="0.8"/>
  <ellipse cx="126" cy="80" rx="10" ry="12" fill="#501A4A"/>
  <rect x="122" y="88" width="4" height="12" rx="2" fill="#3A0F34"/>

  <!-- Main House Structure -->
  <!-- Left Wall -->
  <path d="M42 62 L78 50 L78 94 L42 98 Z" fill="url(#wallLeft)"/>

  <!-- Right Wall -->
  <path d="M78 50 L118 64 L118 96 L78 94 Z" fill="url(#wallRight)"/>

  <!-- Roof - Left Face -->
  <path d="M38 60 L78 30 L80 48 L40 64 Z" fill="#501A4A"/>

  <!-- Roof - Main Front Gabled Face -->
  <path d="M76 28 L122 46 L78 52 Z" fill="url(#roofGrad)"/>
  <polygon points="78,30 120,46 116,64 78,50" fill="url(#roofGrad)"/>

  <!-- Chimney -->
  <path d="M52 42 L52 32 L60 35 L60 45 Z" fill="#3A0F34"/>
  <ellipse cx="56" cy="33" rx="4" ry="1.5" fill="#EAAA00"/>

  <!-- Front Door -->
  <rect x="90" y="74" width="14" height="21" rx="3" fill="#3A0F34"/>
  <circle cx="101" cy="84" r="1.5" fill="#EAAA00"/>

  <!-- Windows with Warm Lit Glass -->
  <!-- Window Left -->
  <polygon points="50,68 66,63 66,78 50,82" fill="#FFFFFF" fill-opacity="0.9"/>
  <line x1="58" y1="65" x2="58" y2="80" stroke="#B46EA8" stroke-width="1.5"/>
  <line x1="50" y1="75" x2="66" y2="70" stroke="#B46EA8" stroke-width="1.5"/>

  <!-- Window Right Upper -->
  <rect x="88" y="56" width="12" height="12" rx="2" fill="#FEFAEE"/>
  <rect x="90" y="58" width="8" height="8" rx="1" fill="#EAAA00" fill-opacity="0.4"/>
  <line x1="94" y1="56" x2="94" y2="68" stroke="#3A0F34" stroke-width="1"/>
  <line x1="88" y1="62" x2="100" y2="62" stroke="#3A0F34" stroke-width="1"/>

  <!-- Small Bush Left -->
  <ellipse cx="40" cy="95" rx="9" ry="8" fill="#6B2560"/>
  <ellipse cx="46" cy="96" rx="6" ry="6" fill="#8C3A7E"/>
</svg>
