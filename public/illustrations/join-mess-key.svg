<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="keyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAE199" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#EAAA00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EAAA00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CE66"/>
      <stop offset="40%" stop-color="#EAAA00"/>
      <stop offset="100%" stop-color="#A07200"/>
    </linearGradient>
    <linearGradient id="innerHoleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A07200"/>
      <stop offset="100%" stop-color="#7A5600"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="88" cy="58" rx="55" ry="45" fill="url(#keyGlow)"/>

  <!-- Shadow below key -->
  <ellipse cx="80" cy="98" rx="44" ry="7" fill="#A07200" fill-opacity="0.15"/>

  <!-- Key Graphic (Rotated ~45 deg) -->
  <g transform="translate(80, 56) rotate(-35) translate(-80, -56)">
    <!-- Key Bow (Head) -->
    <circle cx="54" cy="56" r="26" fill="url(#goldKeyGrad)"/>
    <circle cx="54" cy="56" r="14" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="54" cy="56" r="11" fill="url(#innerHoleGrad)"/>

    <!-- Key Shaft -->
    <rect x="76" y="50" width="48" height="12" rx="4" fill="url(#goldKeyGrad)"/>

    <!-- Key Teeth / Bits -->
    <rect x="108" y="60" width="8" height="15" rx="3" fill="url(#goldKeyGrad)"/>
    <rect x="118" y="60" width="7" height="10" rx="2.5" fill="url(#goldKeyGrad)"/>

    <!-- Glossy Highlights -->
    <path d="M40 44 C46 36 62 36 68 44" stroke="#FEFAEE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <line x1="82" y1="53" x2="114" y2="53" stroke="#FEFAEE" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Sparkles -->
  <path d="M124 24 L126 30 L132 32 L126 34 L124 40 L122 34 L116 32 L122 30 Z" fill="#EAAA00"/>
  <circle cx="42" cy="28" r="2" fill="#EAAA00" opacity="0.8"/>
  <circle cx="128" cy="88" r="2.5" fill="#EAAA00" opacity="0.7"/>
</svg>
